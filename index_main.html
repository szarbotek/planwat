            // 1. Wywołanie funkcji create 4 razy dla wybranych miesięcy

            create("II", "2027");

            // await loadAndFillPlan();

            // 4. Automatyczne przejście / przewinięcie do bieżącego miesiąca
            scrollToCurrentMonth();
        }

        // Uruchomienie po pełnym załadowaniu struktury HTML
        window.addEventListener("DOMContentLoaded", initApp);
